[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-local"
version = "1.2.0"
description = "Local desktop chat runtime with persistent memory for Atlas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Atlas" },
]
dependencies = [
    "cryptography==49.0.0",
    "fastapi==0.139.2",
    "keyring==25.7.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "mem0ai==2.0.13",
    "pypdf==6.14.2",
    "python-dotenv==1.2.2",
    "sqlcipher3-wheels==0.5.7",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]

[project.scripts]
atlas = "atlas_local.entrypoints:atlas_main"
atlas-backend = "atlas_local.entrypoints:atlas_backend_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

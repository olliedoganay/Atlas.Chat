name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild and publish, for example v1.2.0. Leave blank to build artifacts only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve and verify release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          tag=""
          publish="false"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            publish="true"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            publish="true"
          fi

          if [[ -n "$tag" ]]; then
            version="$(python scripts/check_atlas_version.py --tag "$tag")"
          else
            version="$(python scripts/check_atlas_version.py)"
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm ci

      - name: Verify version manifests
        run: python scripts/check_atlas_version.py

      - name: Test and lint backend
        run: |
          python -m unittest discover -s tests
          ruff check src tests scripts

      - name: Test and build frontend
        working-directory: apps/atlas
        run: |
          npm test
          npm run build

      - name: Verify Rust desktop shell
        working-directory: apps/atlas/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  build-linux:
    needs:
      - metadata
      - verify
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install --require-hashes -r requirements.lock
          ./.venv/bin/python -m pip install --no-deps -e .
          ./.venv/bin/python -m pip check

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm ci

      - name: Build Linux release bundles
        working-directory: apps/atlas
        run: npm run tauri build -- --ci --bundles deb,rpm,appimage

      - name: Stage bundles and checksums
        shell: bash
        run: |
          mkdir -p dist/linux
          bundle_root="apps/atlas/src-tauri/target/release/bundle"
          for pattern in '*.deb' '*.rpm' '*.AppImage'; do
            mapfile -d '' files < <(find "$bundle_root" -type f -name "$pattern" -print0)
            if (( ${#files[@]} != 1 )); then
              echo "Expected exactly one $pattern bundle; found ${#files[@]}."
              exit 1
            fi
            cp "${files[0]}" dist/linux/
          done
          (
            cd dist/linux
            find . -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' \
              > SHA256SUMS-linux.txt
            sha256sum --check SHA256SUMS-linux.txt
          )

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-linux-v${{ needs.metadata.outputs.version }}
          path: dist/linux/*
          if-no-files-found: error

  build-windows:
    needs:
      - metadata
      - verify
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          .\.venv\Scripts\python.exe -m pip check

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm.cmd ci

      - name: Build Windows MSI bundle
        run: .\scripts\build_atlas_release.ps1

      - name: Stage installer and checksum
        run: |
          $destination = New-Item -ItemType Directory -Path dist\windows -Force
          $artifacts = @(Get-ChildItem apps\atlas\src-tauri\target\release\bundle -Recurse -File -Filter *.msi)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one MSI installer artifact; found $($artifacts.Count)."
          }
          $checksums = foreach ($artifact in $artifacts) {
            Copy-Item $artifact.FullName -Destination $destination.FullName
            $hash = Get-FileHash $artifact.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($artifact.Name)"
          }
          $checksums | Set-Content dist\windows\SHA256SUMS-windows.txt -Encoding utf8

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-windows-v${{ needs.metadata.outputs.version }}
          path: dist/windows/*
          if-no-files-found: error

  build-macos:
    needs:
      - metadata
      - verify
    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install --require-hashes -r requirements.lock
          ./.venv/bin/python -m pip install --no-deps -e .
          ./.venv/bin/python -m pip check

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm ci

      - name: Build macOS DMG bundle
        working-directory: apps/atlas
        run: npm run tauri build -- --ci --bundles dmg

      - name: Stage architecture-specific DMG
        working-directory: apps/atlas
        shell: bash
        run: |
          mkdir -p ../../dist/macos
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one DMG file; found ${#files[@]}."
            exit 1
          fi
          cp "${files[0]}" "../../dist/macos/Atlas.Chat_${{ needs.metadata.outputs.version }}_${{ matrix.arch }}.dmg"
          (
            cd ../../dist/macos
            shasum -a 256 -- *.dmg > "SHA256SUMS-macos-${{ matrix.arch }}.txt"
            shasum -a 256 --check "SHA256SUMS-macos-${{ matrix.arch }}.txt"
          )

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-macos-${{ matrix.arch }}-v${{ needs.metadata.outputs.version }}
          path: dist/macos/*
          if-no-files-found: error

  publish:
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: atlas-*-v${{ needs.metadata.outputs.version }}
          path: dist/release
          merge-multiple: true

      - name: Verify platform checksums and create release checksum
        shell: bash
        run: |
          cd dist/release
          shopt -s nullglob
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.msi' '*_x64.dmg' '*_arm64.dmg'; do
            files=($pattern)
            if (( ${#files[@]} != 1 )); then
              echo "Expected exactly one $pattern release artifact; found ${#files[@]}."
              exit 1
            fi
          done
          manifests=(SHA256SUMS-*.txt)
          if (( ${#manifests[@]} != 4 )); then
            echo "Expected four platform checksum manifests; found ${#manifests[@]}."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            sha256sum --check "$manifest"
          done
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS*.txt' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Atlas v${{ needs.metadata.outputs.version }}
          body_path: docs/releases/v${{ needs.metadata.outputs.version }}.md
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true

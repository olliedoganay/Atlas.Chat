name: release-macos

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish macOS DMGs to, for example v1.1.4. Leave blank to build artifacts only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: build-release-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt
          ./.venv/bin/python -m pip install -e .

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm ci

      - name: Resolve Atlas version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            version="$(./.venv/bin/python ./scripts/check_atlas_version.py --tag "$RELEASE_TAG")"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$(./.venv/bin/python ./scripts/check_atlas_version.py --tag "$GITHUB_REF_NAME")"
          else
            version="$(./.venv/bin/python ./scripts/check_atlas_version.py)"
          fi
          echo "atlas_version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Atlas macOS DMG bundle
        working-directory: apps/atlas
        run: npm run tauri build -- --ci

      - name: Stage architecture-specific DMG
        working-directory: apps/atlas
        run: |
          mkdir -p ../../dist/macos
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#files[@]} == 0 )); then
            echo "No DMG files were produced."
            exit 1
          fi
          for file in "${files[@]}"; do
            cp "$file" "../../dist/macos/Atlas.Chat_${{ steps.version.outputs.atlas_version }}_${{ matrix.arch }}.dmg"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-macos-${{ matrix.arch }}-v${{ steps.version.outputs.atlas_version }}
          path: |
            dist/macos/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build-release
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve Atlas version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "atlas_version=$version" >> "$GITHUB_OUTPUT"

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: atlas-macos-*-v${{ steps.version.outputs.atlas_version }}
          path: dist/macos
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Atlas v${{ steps.version.outputs.atlas_version }}
          files: dist/macos/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true

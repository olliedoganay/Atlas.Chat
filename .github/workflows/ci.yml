name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Install frontend dependencies
        working-directory: apps/atlas
        run: npm ci

      - name: Verify release manifests
        run: python scripts/check_atlas_version.py

      - name: Run backend tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests

      - name: Run backend tests with isolated CI keyring
        if: runner.os == 'Linux'
        env:
          PYTHON_KEYRING_BACKEND: ci_keyring.MemoryKeyring
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m unittest discover -s tests

      - name: Lint Python
        if: runner.os == 'Linux'
        run: ruff check src tests scripts

      - name: Run frontend tests
        working-directory: apps/atlas
        run: npm test

      - name: Build frontend
        working-directory: apps/atlas
        run: npm run build

      - name: Check Rust desktop shell
        working-directory: apps/atlas/src-tauri
        run: cargo check --locked

      - name: Test Rust desktop shell
        working-directory: apps/atlas/src-tauri
        run: cargo test --locked

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        working-directory: apps/atlas/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust desktop shell
        if: runner.os == 'Linux'
        working-directory: apps/atlas/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock

      - name: Audit frontend dependencies
        working-directory: apps/atlas
        run: npm run audit:dependencies

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install RustSec audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: apps/atlas/src-tauri
        run: cargo audit
